<div class="fab ripple" onclick="toggleDark()">☾</div>
<script>
function toggleDark(){
  document.documentElement.classList.toggle('dark');
}
</script>

<div class="lightbox-bg" id="lightboxBg" onclick="this.style.display='none'">
  <img id="lightboxImg">
</div>

<script>
// scroll animation
const obs=new IntersectionObserver(es=>{
 es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('visible');});
});
document.querySelectorAll('.scroll-fade').forEach(el=>obs.observe(el));

// lightbox
document.querySelectorAll('img').forEach(i=>{
  i.style.cursor='zoom-in';
  i.onclick=()=>{
    document.getElementById('lightboxImg').src=i.src;
    document.getElementById('lightboxBg').style.display='flex';
  }
});
</script>
