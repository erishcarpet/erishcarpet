
<!DOCTYPE html><html lang="fa"><head>

<style>

.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.1);margin-bottom:20px;}

.product-item{padding:10px;background:#fff;margin:10px 0;border-radius:8px;border:1px solid #ddd;}
.product-item img{width:120px;border-radius:8px;}
</style>
</head><body>

<div class="card">
<h2>افزودن محصول</h2>
<input id="pname" placeholder="نام محصول">
<input id="pimg" type="file" accept="image/*">
<textarea id="pdesc" placeholder="توضیحات"></textarea>
<button onclick="addProduct()">افزودن</button>
</div>

<div class="card">
<h2>محصولات</h2>
<div id="list"></div>
</div>

<script src="admin.js"></script>
